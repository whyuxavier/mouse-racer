:root{--k:#16161d;--bg:#fff3d1;--y:#ffd60a;--n:#ff5c8a;--b:#3a86ff;--g:#38d16a;--o:#ff8c2b;--v:#9b5de5;--r:#ff3b3b;--c:#22d3ee;--car:#ff3b3b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--k);
  font-family:PF7,"Courier New",monospace;font-synthesis:none;font-size:18px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
img.pi{image-rendering:pixelated;display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#6cc24a}
html[data-season=winter]{--bg:#e4eefb}
html[data-season=winter] #cv{background:#eef4ff}
html[data-season=winter] .logo span+span{background:var(--b)}
html[data-season=winter] .logo span+span::after{content:"";position:absolute;left:-5px;right:-5px;top:-9px;height:12px;background:#fff;border:5px solid var(--k);border-radius:0 0 9px 9px/0 0 7px 7px;clip-path:polygon(0 0,100% 0,100% 60%,88% 100%,72% 55%,55% 100%,40% 60%,22% 100%,8% 55%,0 100%)}
html[data-season=winter] .logo span+span{position:relative}
#snow{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
#snow i{position:absolute;top:-14px;width:7px;height:7px;background:#fff;border:2px solid var(--k);animation:fall linear infinite;animation-duration:var(--d);animation-delay:var(--l);left:var(--x);opacity:.95}
@keyframes fall{to{transform:translate(-30px,105vh)}}
@media (prefers-reduced-motion:reduce){#snow{display:none}}

/* ---------- header ---------- */
#top{position:fixed;top:12px;right:12px;z-index:30;display:flex;gap:10px}
.ib{width:46px;height:46px;border:4px solid var(--k);background:#fff;box-shadow:4px 4px 0 var(--k);font-weight:700;font-size:22px;position:relative;line-height:1}
.ib:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
#bSound.off{background:#ced4da}
#bSound.off::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:4px;margin-top:-2px;background:var(--r);transform:rotate(-45deg)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:76px 20px 40px;z-index:10}
.wrap{max-width:980px;margin:0 auto;position:relative}
h2{font-size:clamp(28px,6vw,44px);font-weight:700;line-height:1;margin-bottom:22px;text-transform:uppercase}
.btn{border:4px solid var(--k);background:#fff;padding:12px 18px;font-weight:700;font-size:20px;box-shadow:6px 6px 0 var(--k);text-transform:uppercase;transition:transform .06s,box-shadow .06s;text-align:left}
.btn{display:flex;align-items:center;gap:12px}.btn>img{height:24px;flex:none}.btn.big>img{height:32px}.back{display:inline-flex}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--k)}
.btn.y{background:var(--y)}.btn.g{background:var(--g)}.btn.n{background:var(--n)}.btn.b{background:var(--b);color:#fff}.btn.r{background:var(--r);color:#fff}
.back{position:fixed;top:12px;left:12px;z-index:31;font-size:16px;padding:9px 14px;box-shadow:4px 4px 0 var(--k)}

/* ---------- hero ---------- */
#s-menu::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 34px,var(--bg) 34px 68px),repeating-linear-gradient(90deg,rgba(22,22,29,.16) 0 6px,transparent 6px 92px);
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 68% 48%,#000 0,transparent 100%);mask-image:radial-gradient(ellipse 60% 55% at 68% 48%,#000 0,transparent 100%)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px)}
.logo{font-weight:700;font-size:clamp(46px,8.4vw,96px);line-height:.92;margin-bottom:22px}
.logo span{display:block;width:max-content}
.logo span+span{background:var(--n);color:#fff;border:5px solid var(--k);box-shadow:7px 7px 0 var(--k);padding:2px 14px 6px;transform:rotate(-2deg);margin-top:8px;text-shadow:4px 4px 0 var(--k)}
.lead{font-size:19px;max-width:420px;margin-bottom:24px;line-height:1.3}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;max-width:480px}.hero-l{min-width:0}
.menu .big{grid-column:1/-1;font-size:30px;padding:16px 20px}
.hero-r{position:relative;max-width:340px;width:100%;margin:0 auto;padding:10px 26px 10px 10px}
.hero-r svg{width:100%;height:auto;display:block;overflow:visible}
.hcar{animation:lane .8s cubic-bezier(.2,.9,.3,1) .25s both}
.hcar.done{animation:none}
@keyframes lane{0%{transform:translate(-60px,26px) rotate(0)}45%{transform:translate(-34px,10px) rotate(9deg)}100%{transform:none}}
.tag{position:absolute;display:flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);padding:5px 9px;font-weight:700;font-size:16px;line-height:1}
.tag img{height:18px}
.tag.t1{top:8%;left:-14px;background:var(--c);transform:rotate(-6deg)}
.tag.t2{top:44%;right:-6px;transform:rotate(5deg)}
.tag.t3{bottom:5%;left:-18px;background:var(--y);transform:rotate(-3deg)}
@media (prefers-reduced-motion:reduce){.hcar{animation:none}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:34px;min-height:0}
  .hero-r{max-width:290px}
  .hero-l{min-width:0}
  .tag.t1{left:-4px}.tag.t3{left:-6px}.tag.t2{right:0}
}

@media (max-width:520px){.menu{grid-template-columns:1fr}.menu .btn{font-size:22px;padding:14px 18px}.menu .big{font-size:30px}.menu .btn>img{height:28px;width:34px;object-fit:contain}}
/* ---------- modes ---------- */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.mode{border:5px solid var(--k);box-shadow:8px 8px 0 var(--k);padding:20px 18px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:250px;transition:transform .06s,box-shadow .06s}
.mode:active{transform:translate(5px,5px);box-shadow:3px 3px 0 var(--k)}
.mode img{height:54px;align-self:flex-start}
.mode b{font-size:28px;line-height:1;text-transform:uppercase}
.mode p{font-size:17px;line-height:1.25;flex:1}
.mode small{font-size:15px;font-weight:700;border-top:4px solid currentColor;padding-top:8px}
.mode.m1{background:var(--g)}.mode.m2{background:var(--y);transform:rotate(-1deg)}.mode.m3{background:var(--k);color:#fff;box-shadow:8px 8px 0 var(--r)}
.mode.m3:active{box-shadow:3px 3px 0 var(--r)}
@media (max-width:760px){.modes{grid-template-columns:1fr}.mode{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.mode p{flex-basis:100%}.mode small{flex-basis:100%}.mode.m2{transform:none}}

/* ---------- car ---------- */
.garage{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
#pv{width:168px;height:260px;border:5px solid var(--k);box-shadow:8px 8px 0 var(--k);image-rendering:pixelated;display:block}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:12px;max-width:460px;margin-bottom:20px}
.sw{aspect-ratio:1;border:4px solid var(--k);box-shadow:4px 4px 0 var(--k)}
.sw.on{outline:4px solid var(--k);outline-offset:4px;transform:translate(-2px,-2px)}
.pick{display:inline-flex;align-items:center;gap:12px;border:4px solid var(--k);background:#fff;box-shadow:4px 4px 0 var(--k);padding:8px 12px;font-weight:700}
.pick input{width:52px;height:38px;border:3px solid var(--k);padding:0;background:none}
.hint{margin-top:18px;font-size:16px;max-width:420px}
@media (max-width:600px){.garage{grid-template-columns:1fr;justify-items:start}}

/* ---------- achievements ---------- */
.prog{font-weight:700;font-size:20px;margin-bottom:8px}
.pbar{height:26px;border:4px solid var(--k);background:#fff;box-shadow:5px 5px 0 var(--k);margin-bottom:26px}
.pbar i{display:block;height:100%;background:var(--g);border-right:4px solid var(--k)}
.cat{font-weight:700;font-size:18px;margin:22px 0 12px;display:inline-block;background:var(--k);color:#fff;padding:4px 10px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acard{display:flex;gap:12px;align-items:center;border:4px solid var(--k);background:#fff;box-shadow:5px 5px 0 var(--k);padding:10px}
.acard .ic{flex:none;width:60px;height:60px;border:4px solid var(--k);display:grid;place-items:center;background:var(--y)}
.acard .ic img{width:40px;height:40px}
.acard b{display:block;font-size:17px;line-height:1.1;text-transform:uppercase}
.acard p{font-size:14px;line-height:1.2;margin-top:3px}
.acard time{font-size:12px;opacity:.7}
.acard.locked{background:#b9b9b9;filter:grayscale(1);color:#3a3a3a}
.acard.locked .ic{background:#8a8a8a}.acard.locked .ic img{opacity:.45}
.acard.sp:not(.locked){background:var(--v);color:#fff}.acard.sp:not(.locked) .ic{background:var(--k)}

/* ---------- stats / settings ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{border:4px solid var(--k);background:#fff;box-shadow:5px 5px 0 var(--k);padding:12px}
.tile small{display:block;font-size:14px;text-transform:uppercase}
.tile b{font-size:30px;line-height:1.1}
.tile.c1{background:var(--g)}.tile.c2{background:var(--y)}.tile.c3{background:var(--k);color:#fff}
.rows{display:grid;gap:16px;max-width:420px}
.rows .btn{display:flex;justify-content:space-between;gap:16px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(22,22,29,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border:5px solid var(--k);box-shadow:9px 9px 0 var(--k);padding:22px;width:100%;max-width:460px;max-height:100%;overflow-y:auto;position:relative}
.box h2{margin-bottom:16px}
.box h3{font-size:18px;text-transform:uppercase;margin:14px 0 6px}
.box p,.box li{font-size:16px;line-height:1.3}
.box ul{padding-left:20px}
.box .x{position:absolute;top:10px;right:10px;width:40px;height:40px;font-size:20px}
.box .col{display:grid;gap:14px}
.gh{display:inline-flex;align-items:center;gap:8px;margin-top:16px;border:4px solid var(--k);background:var(--y);box-shadow:4px 4px 0 var(--k);padding:8px 12px;font-weight:700;color:var(--k);text-decoration:none}
.gh svg{width:20px;height:20px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.res .tile{padding:8px;box-shadow:3px 3px 0 var(--k)}.res .tile b{font-size:24px}
.rec{background:var(--n);color:#fff;border:4px solid var(--k);padding:6px 10px;font-weight:700;text-align:center;margin-bottom:14px;animation:pop .5s}
.got{display:grid;gap:8px;margin-bottom:16px}
.got div{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-transform:uppercase}
.got img{width:28px;height:28px;border:3px solid var(--k);background:var(--y);padding:2px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:none}}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:max(8px,env(safe-area-inset-top)) 8px 0}
.hrow{display:flex;gap:7px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.chip{background:#fff;border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);padding:4px 9px;display:flex;align-items:center;gap:6px;line-height:1;font-weight:700;font-size:18px}
.chip small{font-size:11px;font-weight:700;text-transform:uppercase}
.chip.sc{flex-direction:column;align-items:flex-start;gap:2px;min-width:92px}
.chip.sc b{font-size:22px}
.chip.lv{background:var(--y)}
.chip img{height:16px}
.chip.ht img{height:15px}.chip.ht img.e{filter:grayscale(1) brightness(1.5);opacity:.5}
#bPause{pointer-events:auto;background:var(--n);min-width:44px;justify-content:center;padding:4px 6px}#bPause img{height:20px}
.nitro{margin:9px auto 0;width:min(250px,62vw);display:flex;align-items:center;gap:6px;background:var(--k);border:3px solid var(--k);padding:3px 6px;color:#fff;font-size:12px;font-weight:700}
.nitro img{height:14px}
.nbar{flex:1;height:12px;background:#3a3d46}
.nbar i{display:block;height:100%;width:0;background:var(--c)}
.nitro.ready .nbar i{background:var(--y);animation:blink .5s steps(2) infinite}
.nitro.on .nbar i{background:var(--o)}
.nitro.no{animation:shk .25s}
@keyframes blink{50%{opacity:.55}}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#banner{position:fixed;left:50%;top:26%;z-index:6;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;width:max-content;max-width:92vw}
#banner b{display:block;background:var(--y);border:5px solid var(--k);box-shadow:7px 7px 0 var(--k);padding:6px 20px;font-size:clamp(34px,9vw,58px);line-height:1}
#banner span{display:inline-block;margin-top:10px;background:var(--k);color:#fff;padding:4px 10px;font-weight:700;font-size:16px}
#banner.show{animation:ban 1.9s both}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-2deg)}20%,80%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-90%) rotate(-2deg)}}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:94vw}
.toast{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--k);box-shadow:5px 5px 0 var(--k);padding:8px 12px;animation:tin .3s}
.toast img{width:36px;height:36px;border:3px solid var(--k);background:var(--y);padding:3px}
.toast small{display:block;font-size:11px;font-weight:700}
.toast b{font-size:17px;text-transform:uppercase;line-height:1}
.toast.out{opacity:0;transform:translateY(20px);transition:.25s}
.toast.special{background:var(--v);color:#fff;animation:tin .3s,party .45s .3s 8}
.toast.special img{width:56px;height:56px;background:var(--k)}
.toast.special b{font-size:26px}
@keyframes tin{from{opacity:0;transform:translateY(30px) scale(.8)}}
@keyframes party{0%,100%{transform:rotate(-3deg) scale(1);filter:hue-rotate(0)}50%{transform:rotate(3deg) scale(1.12);filter:hue-rotate(160deg)}}
</style>
</head>

<script>
(()=>{'use strict';
/* =====================================================================
   1. CONFIG — усе, що можна налаштувати / розширити
   ===================================================================== */
const CONFIG={
  chordMs:70,            // вікно для «одночасного» натискання
  laneMax:112,           // макс. ширина смуги (ігрові одиниці)
  playerY:.72,           // позиція машини по вертикалі (частка екрана)
  scorePerUnit:.02, coinScore:5,
  invuln:1.6, slowTo:.5,
  nitro:{unlockLevel:3,dur:3.5,mul:1.6,charge:1/18,pickup:.4},
  extraLevelStep:1200,   // очок на кожен рівень після останнього в таблиці
  modes:{
    endless :{hearts:0,heal:false,speedMul:1,   gapMul:1},
    survival:{hearts:3,heal:true, speedMul:1,   gapMul:1},
    hardcore:{hearts:2,heal:false,speedMul:1.12,gapMul:.85}
  },
  // at — очки для входу в рівень; gap — середня відстань між появами машин
  levels:[
    {at:0,   lanes:3,speed:520,gap:580,pair:0,  pool:['mini','mini','sedan','sedan','taxi']},
    {at:150, lanes:3,speed:580,gap:520,pair:.1, pool:['mini','sedan','sedan','taxi','minivan','van']},
    {at:400, lanes:4,speed:640,gap:440,pair:.18,pool:['mini','sedan','sedan','taxi','minivan','van','truck','ambulance']},
    {at:800, lanes:4,speed:700,gap:400,pair:.25,pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police']},
    {at:1300,lanes:5,speed:760,gap:350,pair:.3, pool:['mini','sedan','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']},
    {at:1900,lanes:5,speed:820,gap:325,pair:.35,pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']},
    {at:2600,lanes:5,speed:880,gap:300,pair:.4, pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']},
    {at:3400,lanes:5,speed:940,gap:280,pair:.45,pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']},
    {at:4300,lanes:5,speed:940,gap:262,pair:.5, pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']},
    {at:5300,lanes:5,speed:940,gap:246,pair:.55,pool:['mini','sedan','taxi','minivan','van','truck','bus','ambulance','police','fire']}
  ]

const Scene={objs:[],next:[0,0],forest:[0,0],lampD:300,signD:900,
  reset(){this.objs.length=0;this.next=[0,0];this.forest=[Math.random()<.5?1200:0,0];this.lampD=300;this.signD=900;for(let i=0;i<70;i++)this.advance(20);},
  add(spr,side,off,y,flip){this.objs.push({spr,side,off,y,flip:!!flip});},
  advance(d){
    const o=this.objs;for(let i=0;i<o.length;i++)o[i].y+=d;
    if(o.length&&o[0].y>VH+160)this.objs=o.filter(q=>q.y<=VH+160);
    const space=Math.max(140,VW/2-geo.lanes*geo.laneW/2);
    for(let s=0;s<2;s++){this.next[s]-=d;this.forest[s]-=d;if(this.next[s]>0)continue;const side=s?1:-1;
      if(this.forest[s]>0){const n=2+(Math.random()*3|0);for(let i=0;i<n;i++)this.add(pick(TH.spr.trees),side,78+Math.random()*space,-110-Math.random()*70);this.next[s]=rand(60,105);}
      else{const q=Math.random();
        if(q<.34)this.add(pick(TH.spr.trees),side,82+Math.random()*space,-110);
        else if(q<.6)this.add(pick(TH.spr.bushes),side,46+Math.random()*space,-110);
        else if(q<.92)this.add(pick(TH.spr.flowers),side,44+Math.random()*space,-110);
        else if(TH.spr.snowmen&&Math.random()<.5)this.add(pick(TH.spr.snowmen),side,60+Math.random()*space,-110);
        else this.add(TH.spr.rock,side,50+Math.random()*space,-110);
        this.next[s]=rand(90,260);if(Math.random()<.07)this.forest[s]=rand(900,2600);}
    }

    this.signD-=d;if(this.signD<=0){this.add(pick(TH.spr.signs),Math.random()<.5?-1:1,40,-110);this.signD=rand(1700,4200);}
  },

/* ---------- traffic: чесна генерація ---------- */
// Перевіряє, що з поточної смуги гравця завжди існує шлях без зіткнень
function fair(extra){
  const r=run,n=geo.lanes,k=laneWTarget(n)/20,vb=r.cfg.speed*r.M.speedMul,ph=PH*k,m=46,list=r.cars.concat(extra);
  let fr=new Array(n).fill(0),R=null;
  for(let s=0;s<95;s++){const tt=s*.1,free=new Array(n).fill(true);
    for(let i=0;i<list.length;i++){const c=list[i],y=c.y+(vb-c.vs)*tt;if(Math.abs(y-PY)<(c.def.h*k+ph)/2+m)free[c.lane]=false;}
    const prev=fr.slice();for(let l=0;l<n;l++)fr[l]=free[l]?fr[l]+1:0;
    if(R===null){R=new Set();if(free[r.p.lane])R.add(r.p.lane);else for(let l=0;l<n;l++)if(free[l])R.add(l);if(!R.size)return false;continue;}
    const N2=new Set();
    R.forEach(l=>{if(free[l])N2.add(l);
      if(prev[l]>=4){if(l>0&&prev[l-1]>=4&&free[l-1])N2.add(l-1);if(l<n-1&&prev[l+1]>=4&&free[l+1])N2.add(l+1);}});
    R=N2;if(!R.size)return false;}
  return true;
}
function spawnTraffic(){
  const r=run,cfg=r.cfg,n=geo.lanes,k=geo.laneW/20;let placed=0,baseVs=null;
  const want=(r.nitroT<=0&&Math.random()<cfg.pair)?2:1;
  for(let tries=0;tries<7&&placed<want;tries++){
    const type=pick(cfg.pool),def=VT[type],lane=Math.random()*n|0,h=def.h*k;
    if(r.cars.some(c=>c.lane===lane&&c.y-c.def.h*k/2<80))continue;
    const vs=baseVs!==null?baseVs+rand(-12,12):rand(def.sp[0],def.sp[1]);
    const c={type,def,lane,y:-h/2-12,vs,spr:carSprite(type),ph:Math.random()*9};
    if(!fair([c]))continue;
    r.cars.push(c);placed++;baseVs=vs;
  }
  r.nextV=cfg.gap*r.M.gapMul*rand(.65,1.35)*(placed?1:.35);
}
function spawnCoins(){
  const r=run,n=geo.lanes;let lane=Math.random()*n|0;const cnt=3+(Math.random()*4|0),zig=r.level>=4&&Math.random()<.4;
  for(let i=0;i<cnt;i++){if(zig&&i&&i%2===0)lane=clamp(lane+(Math.random()<.5?-1:1),0,n-1);r.items.push({kind:'coin',lane,y:-40-i*88,ph:i});}
  r.nextC=rand(1500,2500);
}
function burst(x,y,n,cols,sp){const P=run.parts;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rand(.3,1)*sp;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(.3,.7),c:pick(cols),s:rand(5,11)});}}

    if(nl<0||nl>=geo.lanes)return;r.p.lane=nl;r.moves++;if(d<0)save.stats.left++;else save.stats.right++;Sound.move();},

    if(r.level<CONFIG.nitro.unlockLevel||r.energy<.999||r.nitroT>0){const el=$('hNitro');el.classList.remove('no');void el.offsetWidth;el.classList.add('no');return;}
    r.nitroT=CONFIG.nitro.dur;save.stats.nitro++;Sound.nitro();r.shake=.25;},

    r.hits++;save.stats.hits++;r.inv=CONFIG.invuln;r.slow=CONFIG.slowTo;r.shake=.5;r.flash=1;

    if(it.kind==='coin'){r.coins++;save.stats.coins++;Sound.coin();burst(x,it.y,6,['#ffd60a','#fff3a0'],220);}
    else if(it.kind==='nitro'){if(r.nitroT>0)r.nitroT=Math.min(CONFIG.nitro.dur,r.nitroT+CONFIG.nitro.dur*CONFIG.nitro.pickup);else r.energy=Math.min(1,r.energy+CONFIG.nitro.pickup);Sound.pickup();burst(x,it.y,10,['#22d3ee','#fff'],260);}
    else{r.hearts=Math.min(r.M.hearts,r.hearts+1);Sound.pickup();burst(x,it.y,10,['#ff3b3b','#ff5c8a','#fff'],260);}},
  levelUp(){const r=run,oldL=geo.lanes;r.level++;r.cfg=lvlCfg(r.level);geo.lanes=r.cfg.lanes;
    save.stats.maxLevel=Math.max(save.stats.maxLevel,r.level);
    let sub='';
    if(r.level===CONFIG.nitro.unlockLevel)sub=t('bNitro');
    else if(geo.lanes>oldL)sub=t('bLane');
    else if(r.cfg.speed>=MAX_SPEED&&!r.maxSpeed)sub=t('bMax');
    if(geo.lanes>oldL)r.nextV+=500;
    if(r.cfg.speed>=MAX_SPEED)r.maxSpeed=true;
    banner(t('bLvl',{n:r.level}),sub);Sound.level();}
};
function banner(a,b){const el=$('banner');el.firstElementChild.textContent=a;el.lastElementChild.textContent=b;el.lastElementChild.hidden=!b;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}

/* =====================================================================
   10. UPDATE (фізика, delta time)
   ===================================================================== */
function update(dt){
  const r=run,NI=CONFIG.nitro;
  Input.tick(performance.now());
  const unlocked=r.level>=NI.unlockLevel;
  if(r.nitroT>0){r.nitroT-=dt;r.energy=Math.max(0,r.nitroT/NI.dur);if(r.nitroT<=0){r.nitroT=0;r.energy=0;}}
  else if(unlocked&&!r.dead)r.energy=Math.min(1,r.energy+NI.charge*dt);
  r.slow=Math.min(1,r.slow+dt*.5);r.inv=Math.max(0,r.inv-dt);r.shake=Math.max(0,r.shake-dt*1.6);r.flash=Math.max(0,r.flash-dt*2.5);
  const target=r.dead?0:r.cfg.speed*r.M.speedMul*(r.nitroT>0?NI.mul:1)*r.slow;
  r.v+=(target-r.v)*(1-Math.exp(-dt*(r.dead?3:4.5)));
  const d=r.v*dt;r.dist+=d;r.scroll+=d;r.time+=dt;

  // геометрія дороги (плавне розширення)
  const e=1-Math.exp(-dt*3.2);geo.lanesF+=(geo.lanes-geo.lanesF)*e;geo.laneW+=(laneWTarget(geo.lanes)-geo.laneW)*e;
  if(Math.abs(geo.lanes-geo.lanesF)<.002)geo.lanesF=geo.lanes;
  const k=geo.laneW/20;
  r.p.pos+=(r.p.lane-r.p.pos)*(1-Math.exp(-dt*17));
  const px=laneX(r.p.pos),pw=PW*k,ph=PH*k;

  // трафік
  const cars=r.cars;
  for(let i=0;i<cars.length;i++){const a=cars[i];
    for(let j=0;j<cars.length;j++){const b=cars[j];if(a!==b&&a.lane===b.lane&&a.y<b.y&&a.vs<b.vs&&(b.y-b.def.h*k/2)-(a.y+a.def.h*k/2)<55)a.vs=b.vs;}
    a.y+=(r.v-a.vs)*dt;}
  r.cars=cars.filter(c=>c.y-c.def.h*k/2<VH+80&&c.y>-1600);
  if(!r.dead&&r.inv<=0){for(const c of r.cars){
      if(Math.abs(laneX(c.lane)-px)<(c.def.w*k+pw)/2*.8&&Math.abs(c.y-PY)<(c.def.h*k+ph)/2*.92){Game.hit(c);break;}}}

  // предмети
  for(const it of r.items){it.y+=d;
    if(!it.taken&&!r.dead&&Math.abs(laneX(it.lane)-px)<geo.laneW*.44&&Math.abs(it.y-PY)<ph/2+20){it.taken=true;Game.collect(it);}}
  r.items=r.items.filter(it=>!it.taken&&it.y<VH+60);

  // появи
  if(!r.dead){
    r.nextV-=d;if(r.nextV<=0)spawnTraffic();
    r.nextC-=d;if(r.nextC<=0)spawnCoins();
    if(unlocked){r.nextN-=d;if(r.nextN<=0){r.items.push({kind:'nitro',lane:Math.random()*geo.lanes|0,y:-50,ph:0});r.nextN=rand(5000,8500);}}
    if(r.M.heal&&r.hearts<r.M.hearts){r.nextH-=d;if(r.nextH<=0){r.items.push({kind:'heart',lane:Math.random()*geo.lanes|0,y:-50,ph:0});r.nextH=rand(9000,15000);}}
  }
  Scene.advance(d);
  for(const p of r.parts){p.x+=p.vx*dt;p.y+=(p.vy+r.v*.5)*dt;p.l-=dt;}
  r.parts=r.parts.filter(p=>p.l>0);
  if(TH.snow)for(const f of r.flakes){f.w+=dt*2;f.y+=(f.v+r.v*.45)*dt;f.x+=Math.sin(f.w)*18*dt;if(f.y>VH+10){f.y=-10;f.x=Math.random()*VW;}}

  // очки та рівні
  if(!r.dead){r.score=Math.floor(r.dist*CONFIG.scorePerUnit)+r.coins*CONFIG.coinScore;
    while(r.score>=lvlAt(r.level+1))Game.levelUp();}
  r.achT-=dt;if(r.achT<=0){r.achT=.25;Ach.check(false);}
  if(r.dead){r.deadT-=dt;if(r.deadT<=0)endRun('over');}
}

/* =====================================================================
   11. RENDER
   ===================================================================== */
function render(){
  const r=run;if(!r)return;const g=ctx;
  g.setTransform(S*dpr,0,0,S*dpr,0,0);g.imageSmoothingEnabled=false;
  if(r.shake>0)g.translate((Math.random()-.5)*r.shake*34,(Math.random()-.5)*r.shake*34);
  // трава
  g.fillStyle=TH.ground;g.fillRect(-40,-40,VW+80,VH+80);
  if(grassPat){const P=5,Tl=32*P;g.save();g.translate(0,(r.scroll%Tl)-Tl);g.scale(P,P);g.fillStyle=grassPat;g.fillRect(-8,0,VW/P+16,(VH+2*Tl)/P);g.restore();}
  // дорога
  const rw=geo.lanesF*geo.laneW,x0=CX-rw/2,k=geo.laneW/20;
  g.fillStyle=TH.shoulder;g.fillRect(x0-20,-40,rw+40,VH+80);
  if(TH.snow){g.fillStyle='#d6e3f3';for(let y=-40+(r.scroll%64);y<VH+40;y+=64){g.fillRect(x0-20,y,8,22);g.fillRect(x0+rw+12,y+30,8,22);}}
  g.fillStyle=K;g.fillRect(x0-6,-40,rw+12,VH+80);
  g.fillStyle=TH.road;g.fillRect(x0,-40,rw,VH+80);
  if(TH.snow){g.fillStyle='#e6edf7';for(let y=-40+(r.scroll%90);y<VH+40;y+=90){g.fillRect(x0,y,3,40);g.fillRect(x0+rw-3,y+45,3,40);}}
  g.fillStyle=TH.edge;g.fillRect(x0+7,-40,5,VH+80);g.fillRect(x0+rw-12,-40,5,VH+80);
  g.save();g.beginPath();g.rect(x0+16,-40,rw-32,VH+80);g.clip();
  const off=r.scroll%150,nl=Math.ceil(geo.lanesF-.001);
  for(let i=1;i<nl;i++){const x=x0+i*geo.laneW-3;for(let y=-150+off;y<VH+20;y+=150)g.fillRect(x,y,6,74);}
  g.restore();
  // предмети
  const tm=r.time;
  for(const it of r.items){const x=laneX(it.lane);
    if(it.kind==='coin'){const s=geo.laneW*.36;g.drawImage(coinFrames[((tm*9+it.ph)|0)%4],x-s/2,it.y-s/2,s,s);}
    else{const s=geo.laneW*.46*(1+Math.sin(tm*8)*.06);g.fillStyle=K;g.fillRect(x-s/2-4,it.y-s/2-4,s+8,s+8);
      g.fillStyle=it.kind==='nitro'?'#22d3ee':'#fff';g.fillRect(x-s/2,it.y-s/2,s,s);
      const ic=it.kind==='nitro'?ICV.bolt:ICV.heart,ih=s*.7,iw=ih*ic.width/ic.height;g.drawImage(ic,x-iw/2,it.y-ih/2,iw,ih);}}
  // трафік
  for(const c of r.cars){const d=c.def,w=d.w*k,h=d.h*k,x=laneX(c.lane);
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x-w/2+k*1.5,c.y-h/2+k*1.5,w,h);
    g.drawImage(c.spr,x-w/2,c.y-h/2,w,h);
    if(d.lb){const on=((tm*7+c.ph)|0)%2,bw=(d.w-6)/2*k,bx=x-w/2+3*k,by=c.y-h/2+d.lb.y*k;
      g.fillStyle=on?d.lb.c[0]:'#2b2b33';g.fillRect(bx,by,bw,2*k);g.fillStyle=on?'#2b2b33':d.lb.c[1];g.fillRect(bx+bw,by,bw,2*k);
      g.globalAlpha=.28;g.fillStyle=on?d.lb.c[0]:d.lb.c[1];g.fillRect((on?bx:bx+bw)-2*k,by-2*k,bw+4*k,6*k);g.globalAlpha=1;}}
  // гравець
  if(!r.dead){const px=laneX(r.p.pos),pw=PW*k,ph=PH*k;
    g.save();g.translate(px,PY);g.rotate((r.p.lane-r.p.pos)*.2);
    if(r.inv>0&&((tm*14)|0)%2)g.globalAlpha=.35;
    g.fillStyle='rgba(0,0,0,.22)';g.fillRect(-pw/2+k*1.5,-ph/2+k*1.5,pw,ph);
    if(r.nitroT>0){const fl=k*(5+Math.random()*7);
      g.fillStyle='#ff8c2b';g.fillRect(-pw/2+2*k,ph/2,3*k,fl);g.fillRect(pw/2-5*k,ph/2,3*k,fl);
      g.fillStyle='#ffd60a';g.fillRect(-pw/2+3*k,ph/2,k,fl*.6);g.fillRect(pw/2-4*k,ph/2,k,fl*.6);
      g.strokeStyle='#22d3ee';g.lineWidth=k;g.globalAlpha*=.5+Math.random()*.5;g.strokeRect(-pw/2-k*1.5,-ph/2-k*1.5,pw+3*k,ph+3*k);g.globalAlpha=(r.inv>0&&((tm*14)|0)%2)?.35:1;}
    g.drawImage(playerSpr,-pw/2,-ph/2,pw,ph);g.restore();}
  // узбіччя (ліхтарі поверх дороги)
  Scene.draw(g,rw);
  // частинки
  for(const p of r.parts){g.globalAlpha=clamp(p.l*2.5,0,1);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  g.globalAlpha=1;
  if(TH.snow){g.fillStyle='rgba(255,255,255,.9)';for(const f of r.flakes)g.fillRect(f.x,f.y,f.s,f.s);}
  // лінії швидкості
  if(r.nitroT>0){g.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<16;i++){const x=Math.random()*VW,y=Math.random()*VH;g.fillRect(x,y,4,rand(70,210));}}
  if(r.flash>0){g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(255,59,59,'+(r.flash*.38)+')';g.fillRect(0,0,cv.width,cv.height);}
}

/* =====================================================================
   13. LOOP / життєвий цикл
   ===================================================================== */
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;
  update(dt);if(!run)return;render();hud();
}
function startLoop(){if(raf)return;last=performance.now();raf=requestAnimationFrame(frame);}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function startRun(mode){
  stopLoop();if(run&&!run.ended)endRun('quit');
  for(const k in hc)delete hc[k];
  newRun(mode);show(null);closeModals();state='play';Input.reset();render();hud();startLoop();
}
function endRun(reason){
  const r=run;if(!r||r.ended)return;r.ended=true;stopLoop();
  const st=save.stats;st.games++;st.byMode[r.mode]=(st.byMode[r.mode]||0)+1;st.dist+=r.dist;st.time+=r.time;st.maxLevel=Math.max(st.maxLevel,r.level);
  const prev=save.best[r.mode]||0;if(r.score>prev){save.best[r.mode]=r.score;r.isBest=true;r.newRecord=prev>0;}
  Ach.check(true);persist();
  if(reason==='over'){state='over';render();hud();showOver();}
}
function pause(){if(state!=='play')return;state='pause';stopLoop();Input.reset();persist();render();syncSound();$('m-pause').hidden=false;}
function resume(){if(state!=='pause')return;$('m-pause').hidden=true;state='play';Input.reset();startLoop();}
function toMenu(){stopLoop();if(run&&!run.ended)endRun('quit');run=null;state='menu';closeModals();show('menu');}
function showOver(){
  const r=run;$('oScore').textContent=r.score;$('oCoins').textContent=r.coins;$('oLvl').textContent=r.level;$('oRec').hidden=!r.isBest;
  $('oAch').innerHTML=r.unlocked.map(id=>{const a=ACH.find(x=>x.id===id);return '<div><img class="pi" src="'+achURL[id]+'" alt="">'+L(a.n)+'</div>';}).join('');
  $('m-over').hidden=false;
}

/* =====================================================================
   14. INPUT — лише Pointer Events (миша + сенсор), без клавіатури
   ===================================================================== */
const Input={hc:{L:0,R:0},touch:new Map(),mask:0,pending:null,
  reset(){this.hc.L=this.hc.R=0;this.touch.clear();this.mask=0;this.pending=null;},
  press(side){const o=side==='L'?'R':'L';
    if(this.hc[o]>0){this.pending=null;Game.nitro();}      // одночасно → нітро, без перестроювань
    else this.pending={side,t:performance.now()};
    this.hc[side]++;},
  release(side){this.hc[side]=Math.max(0,this.hc[side]-1);
    if(this.pending&&this.pending.side===side){const s=this.pending.side;this.pending=null;Game.move(s);}},
  tick(now){const p=this.pending;if(p&&now-p.t>=CONFIG.chordMs){this.pending=null;Game.move(p.side);}},
  mouse(e){const m=e.buttons&3,ch=m^this.mask;this.mask=m;if(!ch)return;
    if(ch&1){if(m&1)this.press('L');else this.release('L');}
    if(ch&2){if(m&2)this.press('R');else this.release('R');}}
};
cv.addEventListener('pointerdown',e=>{e.preventDefault();Sound.unlock();if(state!=='play')return;
  if(e.pointerType==='mouse')Input.mouse(e);
  else{const side=e.clientX<innerWidth/2?'L':'R';Input.touch.set(e.pointerId,side);Input.press(side);}});
// друга кнопка миші, натиснута під час утримання першої, приходить як pointermove
cv.addEventListener('pointermove',e=>{if(state==='play'&&e.pointerType==='mouse')Input.mouse(e);});
function pUp(e){if(state!=='play')return;
  if(e.pointerType==='mouse')Input.mouse(e);
  else if(Input.touch.has(e.pointerId)){const s=Input.touch.get(e.pointerId);Input.touch.delete(e.pointerId);Input.release(s);}}
addEventListener('pointerup',pUp);addEventListener('pointercancel',pUp);

addEventListener('selectstart',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

$('setReset').onclick=()=>{if(!resetArm){resetArm=true;$('setReset').textContent=t('reset2');return;}
  const keep={sound:save.sound,lang:save.lang};save=Object.assign(DEF(),keep);persist();setColor(save.color);resetArm=false;$('setReset').textContent=t('resetOk');};
$('colIn').addEventListener('input',e=>setColor(e.target.value));
$('bPause').onclick=pause;
$('pResume').onclick=resume;
$('pRestart').onclick=()=>startRun(run.mode);
$('pMenu').onclick=toMenu;
$('oRestart').onclick=()=>startRun(run.mode);
$('oMenu').onclick=toMenu;
$('hcar').addEventListener('animationend',e=>e.currentTarget.classList.add('done'));

/* =====================================================================
   16. INIT
   ===================================================================== */
document.querySelectorAll('img[data-pix]').forEach(i=>i.src=IURL[i.dataset.pix]);
document.documentElement.style.setProperty('--car',save.color);
if(SEASON==='winter'){
  const M={'#6cc24a':'#eef4ff','#5db53f':'#d6e3f3','#1e6b2e':'#1f6b4a','#14532d':'#1a5a3e','#2f9e44':'#2d8a5e','#1f7a4d':'#27795a','#51cf66':'#f4f9ff','#2fa36b':'#f4f9ff','#c9b98a':'#ffffff'};
  document.querySelectorAll('.hero-r svg [fill]').forEach(e=>{const f=e.getAttribute('fill').toLowerCase();if(M[f])e.setAttribute('fill',M[f]);});
  const ns='http://www.w3.org/2000/svg',sv=document.querySelector('.hero-r svg'),gl=sv.querySelector('g[clip-path]');
  [[20,22],[40,118],[24,300],[270,70],[284,160],[262,290],[90,60],[130,340],[220,200],[200,330],[90,220]].forEach(([x,y])=>{const r=document.createElementNS(ns,'rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',6);r.setAttribute('height',6);r.setAttribute('fill','#fff');r.setAttribute('stroke','#16161d');r.setAttribute('stroke-width',2);gl.appendChild(r);});
  const sn=document.createElement('div');sn.id='snow';for(let i=0;i<22;i++){const f=document.createElement('i');f.style.setProperty('--x',(Math.random()*100)+'%');f.style.setProperty('--d',rand(7,14).toFixed(1)+'s');f.style.setProperty('--l',(-rand(0,14)).toFixed(1)+'s');sn.appendChild(f);}
  document.body.appendChild(sn);
  const hs=()=>{sn.hidden=!!run;};const _show=show;show=function(n){_show(n);hs();};
}
applyLang();resize();show('menu');
})();
</script>
